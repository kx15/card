<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="theme-color" content="#1E22AA">
<!-- Reached by QR, not by search. Keeps the mobile number out of Google. -->
<meta name="robots" content="noindex, nofollow">

<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="profile">

<style>
  /* ---------------------------------------------------------------
     IPS design system
     Tokens mirrored from ips-media-crm/src/app/globals.css
     and ips-media-crm/src/components/ui/button.tsx
     --------------------------------------------------------------- */
  :root {
    --ips-blue:        #1E22AA;
    --ips-blue-hover:  #181b8a;
    --ips-blue-active: #14178f;
    --ips-light-blue:  #418FDE;

    --white:  #ffffff;
    --ink:    #111827;
    --ink-2:  #4B5563;
    --ink-3:  #6B7280;
    --line:   #E5E7EB;
    --wash:   #F3F4F6;

    --ok:   #15803D;
    --late: #B45309;

    --sans: Verdana, Geneva, Tahoma, sans-serif;
    --radius: 0.375rem;   /* rounded-md */
  }

  * { box-sizing: border-box; }

  html {
    color-scheme: light;
    -webkit-text-size-adjust: 100%;
  }

  body {
    margin: 0;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(0rem, 4vw, 2.5rem) clamp(0rem, 4vw, 2rem);
    background: var(--wash);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 26rem;
    background: var(--white);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(17, 24, 39, 0.06), 0 8px 24px rgba(30, 34, 170, 0.07);
  }

  /* ---- masthead: the identity, reversed out of IPS Blue ---- */

  .masthead {
    position: relative;
    padding: 1.375rem 1.375rem 1.5rem;
    background: var(--ips-blue);
    color: var(--white);
    border-bottom: 3px solid var(--ips-light-blue);
  }

  .strip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }

  .eyebrow {
    font-size: 0.625rem;
    font-weight: bold;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .clock {
    display: flex;
    align-items: center;
    gap: 0.375rem;
    font-size: 0.625rem;
    letter-spacing: 0.05em;
    color: rgba(255, 255, 255, 0.82);
  }

  .dot {
    width: 0.4375rem;
    height: 0.4375rem;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.45);
    flex: none;
  }

  .clock[data-state="open"]   .dot { background: #4ADE80; }
  .clock[data-state="closed"] .dot { background: #FBBF24; }

  /* Verdana is normally a 11px body face. Set large and tightened,
     it becomes the display face without leaving the system. */
  .name {
    margin: 0;
    font-size: clamp(1.875rem, 9.5vw, 2.5rem);
    font-weight: bold;
    line-height: 1.02;
    letter-spacing: -0.035em;
  }

  .name .line { display: block; }
  .name .line + .line { color: rgba(255, 255, 255, 0.72); }

  /* ---- headshot, set beside the name like an ID credential ---- */

  .identity {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.9375rem;
  }

  .identity .name { flex: 1; min-width: 0; }

  .photo,
  .monogram {
    width: 4.5rem;
    height: 4.5rem;
    flex: none;
    border-radius: var(--radius);   /* system radius, not a circle */
  }

  .photo {
    display: block;
    object-fit: cover;
    background: rgba(255, 255, 255, 0.14);
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9);
  }

  /* Shown until a real photo is supplied. */
  .monogram {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
    font-weight: bold;
    letter-spacing: 0.02em;
    color: var(--white);
    background: rgba(255, 255, 255, 0.14);
    box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.55);
  }

  @media (max-width: 22.5rem) {
    .photo,
    .monogram { width: 3.75rem; height: 3.75rem; }
  }

  .dept {
    margin: 0.125rem 0 0;
    font-size: 0.8125rem;
    line-height: 1.4;
    color: rgba(255, 255, 255, 0.82);
  }

  .role {
    margin: 0.875rem 0 0;
    font-size: 0.8125rem;
    font-weight: bold;
    line-height: 1.4;
  }

  .org {
    margin: 0.125rem 0 0;
    font-size: 0.8125rem;
    line-height: 1.4;
    color: rgba(255, 255, 255, 0.82);
  }

  /* Light blue is unreadable as text on IPS Blue, so emphasis inside the
     masthead is carried by weight and full-strength white, not colour. */
  .mark {
    background: none;
    color: var(--white);
    font-weight: bold;
  }

  /* ---- body ---- */

  .panel { padding: 1.375rem; }

  .save {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    min-height: 2.75rem;
    padding: 0.75rem 1rem;
    background: var(--ips-blue);
    color: var(--white);
    font-family: var(--sans);
    font-size: 0.8125rem;
    font-weight: bold;
    text-decoration: none;
    border-radius: var(--radius);
    transition: background-color 0.15s ease;
  }

  .save:hover  { background: var(--ips-blue-hover); }
  .save:active { background: var(--ips-blue-active); }
  .save .glyph { flex: none; }

  .channels {
    list-style: none;
    margin: 1.375rem 0 0;
    padding: 0;
    border-top: 1px solid var(--line);
  }

  .channels li { border-bottom: 1px solid var(--line); }

  .row {
    display: grid;
    grid-template-columns: 4.75rem 1fr auto;
    align-items: center;
    gap: 0.75rem;
    min-height: 2.875rem;
    padding: 0.5rem 0;
    color: var(--ink);
    text-decoration: none;
  }

  .row:hover { background: rgba(30, 34, 170, 0.04); }

  .row .label {
    font-size: 0.5625rem;
    font-weight: bold;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  .row .value {
    font-size: 0.75rem;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }

  /* Light blue clears contrast for graphics, not for small text. */
  .row .glyph {
    color: var(--ips-light-blue);
    transition: transform 0.15s ease;
  }

  .row:hover .glyph { transform: translateX(2px); }

  .avail {
    margin: 1.125rem 0 0;
    font-size: 0.625rem;
    line-height: 1.5;
    color: var(--ink-2);
  }

  a:focus-visible {
    outline: 2px solid var(--ips-blue);
    outline-offset: 2px;
  }

  .masthead a:focus-visible { outline-color: var(--white); }

  @media (prefers-reduced-motion: no-preference) {
    .reveal {
      animation: rise 0.5s cubic-bezier(0.2, 0.7, 0.25, 1) backwards;
      animation-delay: var(--d, 0ms);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(0.375rem); }
      to   { opacity: 1; transform: none; }
    }
  }
</style>
</head>
<body>

<main class="card">

  <div class="masthead">
    <div class="strip reveal" style="--d: 0ms">
      <span class="eyebrow">Media contact</span>
      <span class="clock" id="clock" data-state="unknown">
        <span class="dot" aria-hidden="true"></span>
        <span id="clock-time">--:--</span>
        <span>{{TZ_LABEL}}</span>
      </span>
    </div>

    <div class="identity reveal" style="--d: 60ms">
      <h1 class="name">
{{NAME_LINES}}
      </h1>
{{PHOTO_BLOCK}}
    </div>

    <p class="role reveal" style="--d: 130ms">{{ROLE}}</p>
{{DEPT_BLOCK}}
    <p class="org reveal" style="--d: 180ms">{{ORG_HTML}}</p>
  </div>

  <div class="panel">
    <a class="save reveal" style="--d: 230ms" href="{{VCF_FILE}}" download="{{VCF_DOWNLOAD}}" type="text/vcard">
      <span>Save to contacts</span>
      <svg class="glyph" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M8 2v8m0 0 3.2-3.2M8 10 4.8 6.8M2.5 13h11"
              stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <ul class="channels reveal" style="--d: 290ms">
{{CHANNELS}}
    </ul>

    <p class="avail reveal" style="--d: 350ms">
      Reachable {{HOURS_LABEL}} {{TZ_LABEL}} &middot; UTC{{TZ_SIGNED}}
    </p>
  </div>

</main>

<script>
(function () {
  var OFFSET = {{TZ_OFFSET}};   // hours from UTC
  var OPEN   = {{HOURS_START}};
  var CLOSE  = {{HOURS_END}};

  var clock = document.getElementById("clock");
  var time  = document.getElementById("clock-time");

  function pad(n) { return n < 10 ? "0" + n : String(n); }

  function tick() {
    var now = new Date();
    var there = new Date(now.getTime() + (OFFSET * 60 + now.getTimezoneOffset()) * 60000);

    var h = there.getHours();
    var day = there.getDay();

    time.textContent = pad(h) + ":" + pad(there.getMinutes());

    var weekday = day >= 1 && day <= 5;
    clock.dataset.state = (weekday && h >= OPEN && h < CLOSE) ? "open" : "closed";
  }

  tick();
  setInterval(tick, 20000);
})();
</script>

</body>
</html>
